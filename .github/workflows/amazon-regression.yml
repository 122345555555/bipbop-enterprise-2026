name: Amazon regression tests
on:
  push:
    branches: [fix-sponsored-brands]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all Amazon regression checks
        run: node tests/run-smoke.cjs
